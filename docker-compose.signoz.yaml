services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6-alpine
    container_name: signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - ./.docker/clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/
    networks:
      - signoz-network
    restart: on-failure

  zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper
    user: root
    environment:
      ZOO_SERVER_ID: 1
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: 1
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: 9141
    volumes:
      - ./.docker/zookeeper:/bitnami/zookeeper
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6-alpine
    container_name: signoz-clickhouse
    tty: true
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    volumes:
      - ./.docker/clickhouse:/var/lib/clickhouse/
      - ./.docker/clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/
      - ./apps/signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./apps/signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./apps/signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./apps/signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  signoz-migrator:
    image: signoz/signoz-otel-collector:v0.144.2
    container_name: signoz-telemetrystore-migrator
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - signoz-network
    restart: on-failure

  signoz:
    image: signoz/signoz:v0.118.0
    container_name: signoz
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: local-dev-secret
    volumes:
      - ./.docker/sqlite:/var/lib/signoz/
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-migrator:
        condition: service_completed_successfully
    networks:
      - signoz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.2
    container_name: signoz-otel-collector
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./apps/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./apps/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-migrator:
        condition: service_completed_successfully
    networks:
      - signoz-network
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"

networks:
  signoz-network:
    driver: bridge
