[project]
name = "open-telemetry-experiment-service"
version = "0.1.0"
description = "Example service that processes requests locally"
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "fastapi>=0.115.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "ruff>=0.15.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_telemetry_experiment_service"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
