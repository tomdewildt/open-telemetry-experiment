apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker

  metastore:
    kind: postgres
  telemetrykeeper:
    kind: clickhousekeeper

  signoz:
    spec:
      image: signoz/signoz:v0.139.0
      version: v0.139.0
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.8
      version: v0.144.8
      # Let the browser RUM SDK post spans straight to the OTLP HTTP receiver.
      config:
        data:
          ingester.yaml: |
            receivers:
              otlp:
                protocols:
                  http:
                    cors:
                      allowed_origins:
                        - http://localhost:3000
                      allowed_headers:
                        - Content-Type
