[project]
name = "open-telemetry-experiment-worker"
version = "0.1.0"
description = "Example worker api and saq worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "saq[hiredis]>=0.25.0",
    "uvicorn[standard]>=0.34.0",
    "watchfiles>=1.0.0",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "ruff>=0.15.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_telemetry_experiment_worker"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
